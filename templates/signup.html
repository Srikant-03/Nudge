<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account - NUDGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://ai-public.creatie.ai/gen_page/tailwind-custom.css" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com/3.4.5?plugins=forms@0.5.7,typography@0.5.13,aspect-ratio@0.4.2,container-queries@0.1.1"></script>
    <script src="https://ai-public.creatie.ai/gen_page/tailwind-config.min.js" data-color="#000000" data-border-radius="small"></script>
    <style>
        body { background: #121212; }
        .neon-glow { transition: all 0.3s ease; }
        .neon-glow:hover { box-shadow: 0 0 20px rgba(0, 163, 255, 0.5); }
        .input-icon { color: #00A3FF; }
        .form-input { background: #2A2A2A; border: 1px solid #404040; transition: all 0.3s ease; }
        .form-input:focus { border-color: #00A3FF; box-shadow: 0 0 15px rgba(0, 163, 255, 0.3); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#1A1A1A] rounded-xl shadow-2xl p-8 space-y-6 border border-[#00A3FF] shadow-[0_0_20px_rgba(0,163,255,0.3)] transition-all duration-300 hover:shadow-[0_0_30px_rgba(0,163,255,0.5)] hover:scale-[1.02]">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-white neon-glow">Create your account</h1>
            <p class="mt-2 text-gray-400">Please fill in the details below</p>
        </div>
        <form class="space-y-6" action="/signup" method="POST">
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Driver&#39;s License Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center">
                        <i class="fas fa-id-card input-icon"></i>
                    </span>
                    <input type="text" name="license" class="form-input w-full pl-10 pr-4 py-3 rounded-lg text-black focus:border-[#00A3FF] focus:shadow-[0_0_10px_rgba(0,163,255,0.2)]" placeholder="Enter your license number" required/>
                </div>
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">New Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center">
                        <i class="fas fa-lock input-icon"></i>
                    </span>
                    <input type="password" name="password" class="form-input w-full pl-10 pr-4 py-3 rounded-lg text-black focus:border-[#00A3FF] focus:shadow-[0_0_10px_rgba(0,163,255,0.2)]" placeholder="Create a password" required/>
                </div>
            </div>
            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Re-enter Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center">
                        <i class="fas fa-lock input-icon"></i>
                    </span>
                    <input type="password" name="confirm_password" class="form-input w-full pl-10 pr-4 py-3 rounded-lg text-black focus:border-[#00A3FF] focus:shadow-[0_0_10px_rgba(0,163,255,0.2)]" placeholder="Confirm your password" required/>
                </div>
            </div>
            <div class="flex gap-4">
                <button type="button" class="flex-1 px-4 py-3 bg-[#2A2A2A] text-white rounded-lg border border-[#00A3FF] hover:bg-[#1A1A1A] hover:shadow-[0_0_15px_rgba(0,163,255,0.5)] transition-all duration-300 !rounded-button">
                    <i class="fas fa-camera mr-2"></i>
                    Face Recognition
                </button>
                <button type="submit" class="flex-1 px-4 py-3 bg-[#0066CC] text-white rounded-lg hover:bg-[#005BB8] hover:shadow-[0_0_15px_rgba(0,163,255,0.5)] transition-all duration-300 !rounded-button">
                    <i class="fas fa-check mr-2"></i>
                    Confirm
                </button>
            </div>
        </form>
        <p class="text-center text-sm text-gray-400">
            Already have an account? 
            <a href="#" class="text-[#00A3FF] hover:text-[#33B5FF] neon-glow">Sign in</a>
        </p>
    </div>
</body>
</html>
